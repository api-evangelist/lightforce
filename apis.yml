apis:
- aid: lightforce:identity
  name: LightForce Identity (OpenID Connect)
  description: 'The public OpenID Connect / OAuth 2.0 identity surface that fronts the
    LightForce Doctor Portal. Published as a live OIDC discovery document at
    id.lightforceortho.com/.well-known/openid-configuration, it exposes standard
    authorization, token, device-authorization, userinfo, revocation, dynamic client
    registration, and JWKS endpoints. Client registration is not open to the public —
    this is the authentication surface for LightForce practice users, captured here
    because it is genuinely public and machine-discoverable.'
  humanURL: https://id.lightforceortho.com/.well-known/openid-configuration
  baseURL: https://id.lightforceortho.com
