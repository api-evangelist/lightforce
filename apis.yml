aid: lightforce
name: Lightforce
description: 'LightForce Orthodontics, Inc. is a Boston-area medical device and digital
  manufacturing company that produces "generative braces" — fully customized, 3D-printed
  orthodontic brackets and indirect bonding trays generated from each patient''s own
  tooth anatomy and the treating orthodontist''s digital treatment plan. Doctors submit
  intraoral scans and treatment plans through the LightForce Doctor Portal, LightForce
  designs and 3D-prints patient-specific LightBracket ceramic and metal appliances,
  and ships custom IDB trays back to the practice. The company operates as a HIPAA-covered
  digital workflow: no public developer API or developer portal is published, but the
  Doctor Portal is fronted by a public OpenID Connect identity surface at
  id.lightforceortho.com. Backed by Matrix Partners, Kleiner Perkins, and others.'
